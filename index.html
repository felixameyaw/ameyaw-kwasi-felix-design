<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix | Designer Portfolio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
line-height:1.6;
}

header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(135deg,#1e3c72,#2a5298);
}

header h1{
font-size:4rem;
}

header p{
font-size:1.2rem;
margin-top:10px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:white;
color:black;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

section{
padding:80px 10%;
}

h2{
text-align:center;
margin-bottom:40px;
font-size:2.5rem;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:15px;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.03);
}

.about{
max-width:800px;
margin:auto;
text-align:center;
}

footer{
text-align:center;
padding:30px;
background:#000;
}
</style>

</head>
<body>

<header>
<h1>Felix</h1>
<p>Creative Designer & Digital Artist</p>
<a href="#portfolio" class="btn">View My Work</a>
</header>

<section class="about">
<h2>About Me</h2>
<p>
I'm Felix, a passionate designer creating modern graphics,
branding concepts, social media designs, posters and creative artwork.
</p>
</section>

<section id="portfolio">
<h2>My Designs</h2>

<div class="gallery">

<img src="design1.jpg" alt="Design 1">

<img src="design2.jpg" alt="Design 2">

<img src="design3.jpg" alt="Design 3">

<img src="design4.jpg" alt="Design 4">

<img src="design5.jpg" alt="Design 5">

<img src="design6.jpg" alt="Design 6">

</div>

</section>

<footer>
© 2026 Felix Portfolio
</footer>

</body>
</html>
